name: custom_masonry_grid
description: A lightweight, reusable, and dependency-free Masonry Grid widget for Flutter. Perfect for creating image galleries, Pinterest-style layouts, or dynamic content feeds with built-in loading animations.
version: 1.0.3

homepage: https://github.com/oxfaysal/custom_masonry_grid
repository: https://github.com/oxfaysal/custom_masonry_grid
issue_tracker: https://github.com/oxfaysal/custom_masonry_grid/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^3.0.0


flutter:
  assets:
    - assets/masonry_demo.png 